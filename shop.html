<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المتجر - سنابل الخيرات للتموين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body class="shop-body">

  <!-- ===== الهيدر ===== -->
  <header class="shop-header">
    <div class="header-brand">
      <span class="logo-icon">🌾</span>
      <h1>سنابل الخيرات</h1>
    </div>

    <div class="header-actions">
      <button type="button" class="notif-btn" id="notifBtn" aria-label="الإشعارات">
        🔔
        <span class="notif-count hidden" id="notifCount">0</span>
      </button>

      <button type="button" class="profile-btn" id="profileBtn" aria-label="الملف الشخصي">
        <span class="user-icon">👤</span>
        <span id="userName" class="user-name">...</span>
      </button>

      <button type="button" class="cart-btn" id="cartBtn" aria-label="سلة المشتريات">
        <span class="cart-icon">🛒</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- ===== المحتوى الرئيسي ===== -->
  <main class="shop-main">

    <!-- البحث والتصنيف -->
    <div class="shop-toolbar">
      <div class="search-box">
        <input type="text" id="searchShop" placeholder="🔍 ابحث عن منتج..." aria-label="ابحث عن منتج">
      </div>
      <div class="category-filter" id="categoryFilter" role="group" aria-label="التصنيفات">
        <button type="button" class="cat-btn active" data-cat="all">الكل</button>
      </div>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="shopProductsGrid">
      <div class="loading-state"><p>⏳ جاري تحميل المنتجات...</p></div>
    </div>

  </main>

  <!-- ===== سلة المشتريات ===== -->
  <div class="cart-overlay hidden" id="cartOverlay">
    <div class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
      <div class="cart-header">
        <h2 id="cartTitle">🛒 سلة المشتريات</h2>
        <button type="button" class="close-btn" id="closeCartBtn" aria-label="إغلاق">✖</button>
      </div>

      <div class="cart-items" id="cartItems">
        <div class="empty-cart"><p>السلة فاضية.</p></div>
      </div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>الإجمالي:</span>
          <span id="cartTotal">0.00$</span>
        </div>
        <button type="button" class="checkout-btn" id="checkoutBtn">
          📱 إتمام الطلب عبر واتساب
        </button>
      </div>
    </div>
  </div>

  <!-- ===== بروفايل الزبون ===== -->
  <div class="modal-overlay hidden" id="profileModal">
    <div class="profile-card" role="dialog" aria-modal="true" aria-labelledby="profileName">
      <button type="button" class="close-btn profile-close" id="closeProfileBtn" aria-label="إغلاق">✖</button>

      <div class="profile-avatar-large">👤</div>
      <h3 id="profileName" class="profile-name">...</h3>
      <p class="text-muted" id="profileUsername">...</p>

      <button type="button" class="logout-shop-btn" id="logoutShopBtn">
        🚪 تسجيل خروج
      </button>
    </div>
  </div>

  <!-- ===== نافذة الإشعارات ===== -->
  <div class="modal-overlay hidden" id="notificationsModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="notifTitle" style="max-width: 450px; background: white; border-radius: 16px; overflow: hidden;">
      <div class="modal-header" style="background: #fafafa; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;">
        <h2 id="notifTitle" style="margin: 0; font-size: 1.2rem;">🔔 الإشعارات</h2>
        <button type="button" class="close-btn" id="closeNotifModal" aria-label="إغلاق" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✖</button>
      </div>
      <div class="modal-body" id="notificationsList" style="max-height: 60vh; overflow-y: auto; padding: 15px;">
        <!-- تتحمل الإشعارات هون من shop.js -->
      </div>
    </div>
  </div>

  <!-- ===== نافذة اختيار العرض ===== -->
  <div class="modal-overlay hidden" id="offerChoiceModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="offerTitle" style="max-width: 400px; background: white; border-radius: 16px; overflow: hidden;">
      <div class="modal-header" style="background: #fafafa; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;">
        <h2 id="offerTitle" style="margin: 0; font-size: 1.2rem;">🎁 عرض خاص</h2>
        <button type="button" class="close-btn" id="closeOfferModal" aria-label="إغلاق" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✖</button>
      </div>
      <div class="modal-body" style="padding: 20px; text-align: center;">
        <div id="offerDetails" style="margin-bottom: 20px;"></div>

        <button type="button" class="btn btn-outline" id="chooseSingleBtn" style="width:100%; margin-bottom:10px; padding: 12px; border-radius: 10px; border: 2px solid #ddd; background: white; font-weight: 700; cursor: pointer;">
          🛒 إضافة منتج واحد فقط
        </button>
        <button type="button" class="btn btn-primary" id="chooseFullOfferBtn" style="width:100%; padding: 12px; border-radius: 10px; border: none; background: #d4af37; color: black; font-weight: 700; cursor: pointer;">
          🎁 إضافة العرض كامل
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/shop.js"></script>
</body>
</html>
