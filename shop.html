<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المتجر - سنابل الخيرات للتموين</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body class="shop-body">

  <!-- ===== الهيدر الثابت ===== -->
  <header class="shop-header">
    <div class="header-brand">
      <span class="logo-icon">🌾</span>
      <h1>سنابل الخيرات</h1>
    </div>
    
    <div class="header-actions">
      <button class="profile-btn" id="profileBtn">
        <span class="user-icon">👤</span>
        <span id="userName" class="user-name">...</span>
      </button>
      
      <button class="cart-btn" id="cartBtn">
        <span class="cart-icon">🛒</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- ===== شريط الإشعارات ===== -->
  <div id="notificationBanner" class="notification-banner hidden">
    <span id="notificationText"></span>
    <button id="closeNotification">✖</button>
  </div>

  <!-- ===== المحتوى الرئيسي ===== -->
  <main class="shop-main">
    
    <!-- أدوات البحث والتصنيف -->
    <div class="shop-toolbar">
      <div class="search-box">
        <input type="text" id="searchShop" placeholder="🔍 ابحث عن منتج...">
      </div>
      <div class="category-filter" id="categoryFilter">
        <button class="cat-btn active" data-cat="all">الكل</button>
      </div>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="shopProductsGrid">
      <div class="loading-state"><p>⏳ جاري تحميل المنتجات...</p></div>
    </div>

  </main>

  <!-- ===== سلة المشتريات ===== -->
  <div class="cart-overlay hidden" id="cartOverlay">
    <div class="cart-drawer">
      <div class="cart-header">
        <h2>🛒 سلة المشتريات</h2>
        <button class="close-btn" id="closeCartBtn">✖</button>
      </div>

      <div class="cart-items" id="cartItems">
        <div class="empty-cart"><p>السلة فاضية.</p></div>
      </div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>الإجمالي:</span>
          <span id="cartTotal">0.00$</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn">
          📱 إتمام الطلب عبر واتساب
        </button>
      </div>
    </div>
  </div>

  <!-- ===== بروفايل الزبون ===== -->
  <div class="modal-overlay hidden" id="profileModal">
    <div class="profile-card">
      <button class="close-btn profile-close" id="closeProfileBtn">✖</button>
      
      <div class="profile-avatar-large">👤</div>
      <h3 id="profileName" class="profile-name">...</h3>
      <p class="text-muted" id="profileUsername">...</p>
      
      <button class="logout-shop-btn" id="logoutShopBtn">
        🚪 تسجيل خروج
      </button>
    </div>
  </div>

  <script type="module" src="js/shop.js"></script>
</body>
</html>
